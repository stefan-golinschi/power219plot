<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>power219plot</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f3f1eb;
      --ink: #1c1b19;
      --muted: #6b675f;
      --line: #d4d0c6;
      --accent: #0b6e4f;
      --warn: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .status {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .status[data-ok="true"] { color: var(--accent); }
    .status[data-ok="false"] { color: var(--warn); }
    main {
      padding: 1rem 1.5rem 2rem;
      display: grid;
      gap: 1.25rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.85rem 1.25rem;
    }
    .stat dt {
      margin: 0;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .stat dd {
      margin: 0.15rem 0 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.35rem;
      font-variant-numeric: tabular-nums;
    }
    .chart-wrap {
      background: #fff;
      border: 1px solid var(--line);
      padding: 0.75rem;
      min-height: 22rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
    }
    button {
      font: inherit;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }
    button:hover { background: var(--ink); color: var(--bg); }
  </style>
</head>
<body>
  <header>
    <h1>power219plot</h1>
    <div class="status" id="status" data-ok="false">connecting…</div>
    <div class="actions">
      <button type="button" id="clear">Clear</button>
    </div>
  </header>
  <main>
    <dl class="stats">
      <div class="stat"><dt>Average</dt><dd id="avg">—</dd></div>
      <div class="stat"><dt>Peak</dt><dd id="peak">—</dd></div>
      <div class="stat"><dt>Min</dt><dd id="min">—</dd></div>
      <div class="stat"><dt>Bus</dt><dd id="bus">—</dd></div>
      <div class="stat"><dt>Min bus</dt><dd id="minbus">—</dd></div>
      <div class="stat"><dt>Power</dt><dd id="power">—</dd></div>
      <div class="stat"><dt>Samples</dt><dd id="count">0</dd></div>
    </dl>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </main>
  <script>
    const fmt = (v, unit) => v == null || Number.isNaN(v) ? '—' : `${v.toFixed(2)} ${unit}`;

    const chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        datasets: [
          {
            label: 'Current (mA)',
            data: [],
            borderColor: '#0b6e4f',
            backgroundColor: 'transparent',
            tension: 0.15,
            pointRadius: 0,
            borderWidth: 2,
            yAxisID: 'y',
          },
          {
            label: 'Power (mW)',
            data: [],
            borderColor: '#9a3412',
            backgroundColor: 'transparent',
            tension: 0.15,
            pointRadius: 0,
            borderWidth: 2,
            yAxisID: 'y1',
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: {
            type: 'linear',
            title: { display: true, text: 'Time (s)' },
          },
          y: {
            position: 'left',
            title: { display: true, text: 'mA' },
            beginAtZero: true,
          },
          y1: {
            position: 'right',
            title: { display: true, text: 'mW' },
            beginAtZero: true,
            grid: { drawOnChartArea: false },
          },
        },
        plugins: {
          legend: { position: 'top' },
        },
      },
    });

    async function refresh() {
      let data;
      try {
        const res = await fetch('/api/data');
        data = await res.json();
      } catch (err) {
        document.getElementById('status').textContent = 'API unreachable';
        document.getElementById('status').dataset.ok = 'false';
        return;
      }

      const status = document.getElementById('status');
      if (data.connected) {
        status.textContent = 'serial connected';
        status.dataset.ok = 'true';
      } else {
        status.textContent = data.last_error
          ? `serial disconnected: ${data.last_error}`
          : 'serial disconnected';
        status.dataset.ok = 'false';
      }

      const s = data.stats;
      document.getElementById('avg').textContent = fmt(s.avg_current_mA, 'mA');
      document.getElementById('peak').textContent = fmt(s.peak_current_mA, 'mA');
      document.getElementById('min').textContent = fmt(s.min_current_mA, 'mA');
      document.getElementById('bus').textContent = fmt(s.bus_V, 'V');
      document.getElementById('minbus').textContent = fmt(s.min_bus_V, 'V');
      document.getElementById('power').textContent = fmt(s.power_mW, 'mW');
      document.getElementById('count').textContent = String(s.count);

      chart.data.datasets[0].data = data.samples.map((p) => ({ x: p.t, y: p.current_mA }));
      chart.data.datasets[1].data = data.samples.map((p) => ({ x: p.t, y: p.power_mW }));
      chart.update('none');
    }

    document.getElementById('clear').addEventListener('click', async () => {
      await fetch('/api/clear', { method: 'POST' });
      refresh();
    });

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
